name: Daily USA Politics News Automation

on:
  schedule:
    - cron: '0 10 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies for MoviePy & FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick fonts-liberation

    - name: Configure ImageMagick Policy for MoviePy
      run: |
        sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<policy domain="path" rights="read|write" pattern="@\*"/' /etc/ImageMagick-6/policy.xml

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser pillow moviepy==1.0.3 edge-tts nest_asyncio

    - name: Run News Video Generator
      env:
        WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }} 
        SUCCESS_TELEGRAM_TOKEN: ${{ secrets.SUCCESS_TELEGRAM_TOKEN }}
        ERROR_TELEGRAM_TOKEN: ${{ secrets.ERROR_TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py
